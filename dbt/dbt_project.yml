name: red_metropolitana
version: "1.0.0"
config-version: 2
profile: red_metropolitana
require-dbt-version: ">=1.10.0,<2.0.0"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Fecha fija del pipeline. Regla de "fechas del futuro" y corte de features.
  # NUNCA usar CURRENT_DATE en modelos (rompe la idempotencia). Se sobreescribe por --vars.
  fecha_referencia: "2026-07-16"   # verificado en el generador (ADR-010): día siguiente a la última fecha legítima (2026-07-15)
  # Identificador de corrida que Airflow pasa por --vars para ops.run_metrics
  run_id: "manual"
  # Marca de tiempo de la corrida (ISO 8601 UTC) que Airflow pasa por --vars; alimenta quarantine.ts_cuarentena.
  # Si es nula, la cuarentena usa TIMESTAMP(fecha_referencia) para que dos corridas manuales sean idénticas.
  run_ts: null
  # Zona horaria local para conversiones (Aerómetro llega en UTC)
  tz_local: "America/Guatemala"
  # Cota superior del identificador base de personas (ADR-008): el generador crea 60 000; el mapa de
  # inversión del hash de Aerómetro (silver_am_hash_map) se calcula para 1..max_usuario_base_id.
  max_usuario_base_id: 70000

models:
  red_metropolitana:
    +persist_docs: {relation: true, columns: true}
    staging:                      # se vacía en cada corrida (tablas recreadas)
      +schema: staging
      +materialized: table
      +tags: ["staging"]
    silver:
      +schema: silver
      +materialized: table
      +tags: ["silver"]
    quarantine:
      +schema: quarantine
      +materialized: table
      +tags: ["quarantine"]
    gold:                         # solo ref() a silver u otro gold (tests/test_gold_lineage.py)
      +schema: gold
      +materialized: table
      +tags: ["gold"]
    features:                     # solo desde silver
      +schema: features
      +materialized: table
      +tags: ["features"]
    ops:
      +schema: ops
      +materialized: table
      +tags: ["ops"]

seeds:
  red_metropolitana:
    +schema: silver               # catálogos conformados versionados viven con Silver
    +tags: ["seed"]

tests:
  +store_failures: true
  +schema: ops
