name: red_metropolitana
version: "1.0.0"
config-version: 2
profile: red_metropolitana
require-dbt-version: ">=1.10.0,<2.0.0"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Fecha fija del pipeline. Regla de "fechas del futuro" y corte de features.
  # NUNCA usar CURRENT_DATE en modelos (rompe la idempotencia). Se sobreescribe por --vars.
  # Proyecto 2 (ADR-012): datos v2 del 2026-06-01 al 2026-08-29; día siguiente a la última fecha legítima.
  # (Proyecto 1, ADR-010: "2026-07-16" para los 45 días del generador.)
  fecha_referencia: "2026-08-30"
  # Identificador de corrida que Airflow pasa por --vars para ops.run_metrics
  run_id: "manual"
  # Marca de tiempo de la corrida (ISO 8601 UTC) que Airflow pasa por --vars; alimenta quarantine.ts_cuarentena.
  # Si es nula, la cuarentena usa TIMESTAMP(fecha_referencia) para que dos corridas manuales sean idénticas.
  run_ts: null
  # Zona horaria local para conversiones (Aerómetro llega en UTC)
  tz_local: "America/Guatemala"
  # Cota superior del identificador base de personas (ADR-008): el generador crea 60 000; el mapa de
  # inversión del hash de Aerómetro (silver_am_hash_map) se calcula para 1..max_usuario_base_id.
  # Proyecto 2 (ADR-012): los datos v2 llegan a 84 882 y los 16 930 hashes de Aerómetro se invierten con N >= 84 882.
  max_usuario_base_id: 100000
  # Proyecto 2 (ADR-015): fechas de corte A, B y C del dataset de churn (features.churn_*), horizonte de la etiqueta
  # y ventana máxima de las features. `recorte_datos_hasta` (DATE o null) activa la prueba de recorte: con el target
  # `recorte`, staging ignora todo evento posterior a esa fecha, como si los archivos crudos terminaran ahí.
  fechas_corte: ["2026-07-01", "2026-07-31", "2026-08-30"]
  horizonte_dias: 30
  ventana_max_dias: 28
  recorte_datos_hasta: null

models:
  red_metropolitana:
    +persist_docs: {relation: true, columns: true}
    staging:                      # se vacía en cada corrida (tablas recreadas)
      +schema: staging
      +materialized: table
      +tags: ["staging"]
    silver:
      +schema: silver
      +materialized: table
      +tags: ["silver"]
      churn:                      # Proyecto 2: persona x corte (ADR-015)
        +schema: silver
        +tags: ["silver", "churn"]
    quarantine:
      +schema: quarantine
      +materialized: table
      +tags: ["quarantine"]
    gold:                         # solo ref() a silver u otro gold (tests/test_gold_lineage.py)
      +schema: gold
      +materialized: table
      +tags: ["gold"]
    features:                     # solo desde silver
      +schema: features
      +materialized: table
      +tags: ["features"]
      churn:                      # Proyecto 2: dataset de churn por persona y corte (ADR-015)
        +schema: features
        # El tag churn se asigna por modelo: los tags de dbt se acumulan por carpeta y auditoria/ no debe heredarlo.
        churn_eventos: {+tags: ["churn"]}
        churn_poblacion: {+tags: ["churn"]}
        churn_etiqueta: {+tags: ["churn"]}
        churn_features: {+tags: ["churn"]}
        churn_dataset: {+tags: ["churn"]}
        churn_diccionario: {+tags: ["churn"]}
        auditoria:                # entregable 1.3: borrador ingenuo de la prueba de recorte; fuera del DAG (sin tag churn)
          +enabled: true
          +tags: ["auditoria_recorte"]
    ops:
      +schema: ops
      +materialized: table
      +tags: ["ops"]

seeds:
  red_metropolitana:
    +schema: silver               # catálogos conformados versionados viven con Silver
    +tags: ["seed"]

tests:
  +store_failures: true
  +schema: ops
