# Actualizaciones semanales de dependencias (acciones fijadas por SHA, paquetes de Python e imágenes Docker).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /vm
    schedule:
      interval: weekly
